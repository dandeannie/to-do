<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="A beautiful offline-ready Todo & Notes PWA" />
  <title>Noted.</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="noise"></div>

  <header>
    <div class="header-inner">
      <h1 class="logo">Noted<span class="dot">.</span></h1>
      <div class="header-meta">
        <span id="date-display"></span>
        <span class="offline-badge" id="offline-badge">● Offline</span>
      </div>
    </div>
  </header>

  <main>
    <section class="input-section">
      <div class="input-card">
        <input
          type="text"
          id="todo-input"
          placeholder="What's on your mind?"
          autocomplete="off"
          maxlength="120"
        />
        <div class="input-actions">
          <select id="category-select">
            <option value="personal">🌿 Personal</option>
            <option value="work">💼 Work</option>
            <option value="ideas">💡 Ideas</option>
            <option value="urgent">🔥 Urgent</option>
          </select>
          <button id="add-btn" aria-label="Add todo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </section>

    <section class="stats">
      <div class="stat"><span id="stat-total">0</span><label>Total</label></div>
      <div class="stat"><span id="stat-active">0</span><label>Active</label></div>
      <div class="stat"><span id="stat-done">0</span><label>Done</label></div>
    </section>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="empty-state" id="empty-state">
      <div class="empty-icon">✦</div>
      <p>No notes yet.<br/>Add something above.</p>
    </div>

    <div class="list-footer" id="list-footer" style="display:none">
      <button id="clear-done-btn">Clear completed</button>
    </div>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
